<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">나의 인생 4,160주</title>
  <desc id="desc">한 칸을 한 주로 표현한 인생 주간표 앱 미리보기</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d2f"/>
      <stop offset="1" stop-color="#0b3342"/>
    </linearGradient>
    <pattern id="future" width="19" height="19" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="14" height="14" rx="2" fill="none" stroke="#89a4ad" stroke-opacity=".28"/>
    </pattern>
    <pattern id="past" width="19" height="19" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="14" height="14" rx="2" fill="#16a6a1" fill-opacity=".82"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#00111d" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="-30" r="290" fill="#19b5ae" opacity=".08"/>
  <circle cx="80" cy="680" r="260" fill="#f59e55" opacity=".07"/>
  <g transform="translate(76 64)">
    <rect width="255" height="34" rx="17" fill="#16a6a1" fill-opacity=".13" stroke="#4bd1c9" stroke-opacity=".38"/>
    <text x="127.5" y="22" fill="#77e0d8" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2.4">80 YEARS · 4,160 WEEKS</text>
    <text x="0" y="116" fill="#f5f7f7" font-family="'Noto Sans KR', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">나의 인생 4,160주</text>
    <text x="2" y="165" fill="#a9bdc4" font-family="'Noto Sans KR', Arial, sans-serif" font-size="25" font-weight="400">나의 인생, 그렇게 길지 않습니다.</text>
  </g>
  <g transform="translate(76 270)" filter="url(#shadow)">
    <rect width="1048" height="322" rx="18" fill="#0a2637" stroke="#2e5260"/>
    <rect x="32" y="34" width="984" height="232" fill="url(#future)"/>
    <rect x="32" y="34" width="611" height="232" fill="url(#past)"/>
    <rect x="646.5" y="129.5" width="14" height="14" rx="2" fill="#f59e55"/>
    <rect x="643" y="126" width="21" height="21" rx="4" fill="none" stroke="#ffd2aa" stroke-width="2"/>
    <g font-family="'Noto Sans KR', Arial, sans-serif" font-size="14">
      <rect x="32" y="280" width="12" height="12" rx="2" fill="#16a6a1"/>
      <text x="52" y="291" fill="#9fb5bd">지나온 주</text>
      <rect x="148" y="280" width="12" height="12" rx="2" fill="#f59e55"/>
      <text x="168" y="291" fill="#9fb5bd">이번 주</text>
      <rect x="254" y="280" width="12" height="12" rx="2" fill="none" stroke="#89a4ad" stroke-opacity=".55"/>
      <text x="274" y="291" fill="#9fb5bd">앞으로의 주</text>
      <text x="1016" y="291" fill="#6f909b" text-anchor="end">한 칸 = 한 주</text>
    </g>
  </g>
</svg>
